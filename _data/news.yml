- date: 17 November, 2026
  headline: "I'm very happy to have been involved in this project and to see it highlighted in <a href='https://www.anl.gov/article/whats-the-best-way-to-analyze-nuclear-materials-the-answer-may-be-xrays' target='_blank'>this article</a>. Our team built custom containment systems that let us observe nuclear material reactions in real time at Argonne's Advanced Photon Source, including a recent plutonium precipitation experiment."

- date: 15 September, 2026
  headline: "Our Paper, 'A Pipeline-Ordered Diagnostic Protocol for Online Reinforcement Learning with Game-Theoretic Defense and Delayed Environmental Reward in Cyber-Physical Systems' was accepted for publication at the 2026 IEEE CARS Conference - October 26th - 28th (URL coming sooon)."

- date: 01 January, 2026
  headline: "The Report, 'Adaptive Cybersecurity for Distributed Energy Resources (AdCyDER): Online Reinforcement Learning with Stackelberg-Optimized Defenses — Pipeline Architecture, Evaluation Methodology, and Findings from a Synthetic-Data Evaluation' was published on OSTI at <a href='https://www.osti.gov/biblio/3377852'>this link</a>"

